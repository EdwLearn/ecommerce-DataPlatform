version: 2

sources:
  - name: raw
    database: ECOMMERCE_DB
    schema: RAW
    description: "Tablas 1:1 con los CSVs de Olist cargadas desde S3"

    tables:
      - name: orders
        description: "Orden principal con status y timestamps"
        columns:
          - name: order_id
            tests: [not_null, unique]
          - name: customer_id
            tests: [not_null]
          - name: order_status
            tests: [not_null]

      - name: order_items
        description: "Ítems por orden (producto, seller, precio)"
        columns:
          - name: order_id
            tests: [not_null]
          - name: product_id
            tests: [not_null]
          - name: seller_id
            tests: [not_null]

      - name: order_payments
        description: "Métodos y valores de pago"
        columns:
          - name: order_id
            tests: [not_null]

      - name: order_reviews
        description: "Reseñas y scores de clientes"
        columns:
          - name: review_id
            tests: [not_null]

      - name: customers
        description: "Datos de clientes y geolocalización"
        columns:
          - name: customer_id
            tests: [not_null, unique]

      - name: sellers
        description: "Datos de vendedores"
        columns:
          - name: seller_id
            tests: [not_null, unique]

      - name: products
        description: "Catálogo de productos"
        columns:
          - name: product_id
            tests: [not_null, unique]

      - name: product_category_name_translation
        description: "Traducción categorías PT→EN"
        columns:
          - name: product_category_name
            tests: [not_null, unique]

      - name: geolocation
        description: "Coordenadas por zip code BR"
